<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#141414" />
        <title>Admin – Meine Weltreise</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/auth.css" />
        <link rel="stylesheet" href="/admin.css" />
    </head>
    <body class="admin-body">
        <div id="root" style="display:none"></div>

        <!-- Login-Screen (wenn nicht Admin) -->
        <div id="admin-login" class="auth-page" data-testid="admin-login-screen">
            <div class="auth-bg"></div>
            <div class="auth-vignette"></div>
            <header class="auth-topbar">
                <a href="/login.html" class="nav-logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">Weltreise Admin</span>
                </a>
            </header>
            <main class="auth-card-wrap">
                <div class="auth-card">
                    <div class="auth-brand-tag">Admin-Konsole</div>
                    <h1 class="auth-title">Administrator-Zugang</h1>
                    <p class="auth-sub">Bitte gib dein Admin-Passwort ein.</p>
                    <form id="admin-form" class="auth-form" autocomplete="off">
                        <label class="auth-label" for="admin-input">Passwort</label>
                        <div class="auth-input-wrap">
                            <input id="admin-input" class="auth-input" type="password" placeholder="Admin-Passwort" data-testid="admin-password-input" required />
                        </div>
                        <div id="admin-error" class="auth-error" data-testid="admin-error" hidden></div>
                        <button class="btn btn-primary auth-submit" type="submit" data-testid="admin-submit">
                            <span class="btn-label">Anmelden</span>
                            <span class="btn-spinner" hidden></span>
                        </button>
                    </form>
                    <a href="/" class="auth-admin-link" data-testid="back-home-link">← Zurück zur Serie</a>
                </div>
            </main>
        </div>

        <!-- Admin-Dashboard -->
        <div id="admin-dashboard" class="admin-shell" hidden data-testid="admin-dashboard">
            <aside class="admin-sidebar">
                <div class="admin-brand">
                    <span class="logo-mark">W</span>
                    <div>
                        <div class="admin-brand-name">Weltreise</div>
                        <div class="admin-brand-role">Administrator</div>
                    </div>
                </div>
                <nav class="admin-nav">
                    <button class="admin-nav-item active" data-tab="dashboard" data-testid="tab-dashboard">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                        Übersicht
                    </button>
                    <button class="admin-nav-item" data-tab="episodes" data-testid="tab-episodes">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        Episoden
                    </button>
                    <button class="admin-nav-item" data-tab="videos" data-testid="tab-videos">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        Videos verwalten
                    </button>
                    <button class="admin-nav-item" data-tab="media" data-testid="tab-media">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Medien
                    </button>
                    <button class="admin-nav-item" data-tab="seasons" data-testid="tab-seasons">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                        Staffeln
                    </button>
                    <button class="admin-nav-item" data-tab="countries" data-testid="tab-countries">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        Länder
                    </button>
                    <button class="admin-nav-item" data-tab="settings" data-testid="tab-settings">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Einstellungen
                    </button>
                    <button class="admin-nav-item" data-tab="security" data-testid="tab-security">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Sicherheit
                    </button>
                </nav>
                <div class="admin-side-bottom">
                    <a href="/" class="admin-visit-site" data-testid="visit-site">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                        Zur Website
                    </a>
                    <button class="admin-logout" id="admin-logout-btn" data-testid="admin-logout">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Abmelden
                    </button>
                </div>
            </aside>

            <main class="admin-main">
                <header class="admin-topbar-main">
                    <h1 id="admin-page-title">Übersicht</h1>
                    <div id="admin-toast" class="admin-toast" hidden></div>
                </header>
                <div id="admin-content" class="admin-content"></div>
            </main>
        </div>

        <script src="/auth.js"></script>
        <script src="/admin.js"></script>
    </body>
</html>
